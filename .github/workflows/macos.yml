name: Native macOS
on:
  push:
    branches: [native-macos]
    paths: ['macOS/**', 'scintilla/**', 'lexilla/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build native Apple Silicon app
        run: python3 macOS/build.py
      - name: Native integration and recovery tests
        run: python3 macOS/test.py
      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/macOS/NoteX.app dist/NoteX-1.3.2-macos-arm64.zip
          shasum -a 256 dist/NoteX-1.3.2-macos-arm64.zip > dist/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: NoteX-macos-arm64
          path: |
            dist/NoteX-1.3.2-macos-arm64.zip
            dist/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: macos-test-results
          path: |
            dist/macOS/test-results.json
            dist/macOS/native-preview.png
